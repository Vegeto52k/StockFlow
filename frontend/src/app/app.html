<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-header">
      <i class="pi pi-chart-bar"></i>
      <h1>{{ appTitle }}</h1>
    </div>

    <nav class="sidebar-nav">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
      >
        <i class="pi pi-home"></i>
        <span>Dashboard</span>
      </a>

      <a
        routerLink="/clients"
        routerLinkActive="active"
      >
        <i class="pi pi-users"></i>
        <span>Clients</span>
      </a>

      <a
        routerLink="/products"
        routerLinkActive="active"
      >
        <i class="pi pi-box"></i>
        <span>Produits</span>
      </a>

      <a
        routerLink="/orders"
        routerLinkActive="active"
      >
        <i class="pi pi-shopping-cart"></i>
        <span>Commandes</span>
      </a>
    </nav>
  </aside>

  <div class="main-area">

    <header class="topbar">
      <div>
        <span class="application-name">Gestion commerciale</span>
      </div>

      <button pButton routerLink="/orders">
        <i class="pi pi-plus"></i>
        <span>Nouvelle commande</span>
      </button>
    </header>

    <main class="content">
      <router-outlet />
    </main>

  </div>

</div>
